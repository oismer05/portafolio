# Dependabot abre pull requests automáticos cuando hay actualizaciones de seguridad o versiones nuevas.
# Cada PR pasa por el CI antes de que decidas fusionarlo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/frontend, /backend]
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
