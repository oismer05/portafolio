# Nginx para la imagen Docker del frontend (sitio estático + proxy a la API)
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off; # no revela la versión de Nginx

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # Cabeceras de seguridad (las mismas que en vercel.json)
  include /etc/nginx/snippets/security-headers.conf;

  # Archivos con hash en el nombre: se guardan en caché un año
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # La API se sirve desde el mismo dominio: sin CORS y con la IP real del visitante
  location /api/ {
    resolver 127.0.0.11 valid=30s; # DNS interno de Docker
    set $api_upstream http://backend:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32k;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
